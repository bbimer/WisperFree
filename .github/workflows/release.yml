name: Release Build & Artifact Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish Windows App
      run: |
        dotnet publish FreeFlowWin.App/FreeFlowWin.App.csproj -c Release -r win-x64 --self-contained false -o ./publish/FreeFlowStudio-win-x64

    - name: Clean Non-Windows Runtimes (Optimize Archive Size)
      run: |
        Get-ChildItem -Path ./publish/FreeFlowStudio-win-x64/runtimes | Where-Object { $_.Name -ne "win-x64" } | Remove-Item -Recurse -Force

    - name: Compress Release Archive
      run: |
        Compress-Archive -Path ./publish/FreeFlowStudio-win-x64/* -DestinationPath ./publish/FreeFlowStudio-win-x64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/FreeFlowStudio-win-x64.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
