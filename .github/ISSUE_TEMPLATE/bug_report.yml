name: Bug Report
description: Create a report to help us reproduce and fix a bug
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report a bug!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10 (1903+)
        - Other / Virtual Machine
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console / App Logs
      description: Paste any error messages or logs from `%AppData%\FreeFlowWindows\` or console.
